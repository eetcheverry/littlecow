<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="LittleCow">
  <defs>
    <radialGradient id="glass" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#E9E2FF"/>
      <stop offset=".55" stop-color="#B9A4FF"/>
      <stop offset="1" stop-color="#7B4DFF"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD6EA"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4FF6E"/>
      <stop offset="1" stop-color="#8FD12E"/>
    </linearGradient>
  </defs>
  <!-- body / suit -->
  <path d="M60 236c0-44 30-70 68-70s68 26 68 70z" fill="url(#suit)" stroke="#1B3B32" stroke-width="7" stroke-linejoin="round"/>
  <rect x="104" y="196" width="48" height="26" rx="8" fill="#1F4D3F" stroke="#1B3B32" stroke-width="5"/>
  <circle cx="116" cy="209" r="4.5" fill="#C8F56A"/>
  <circle cx="130" cy="209" r="4.5" fill="#FF7AA8"/>
  <circle cx="144" cy="209" r="4.5" fill="#B9A4FF"/>
  <!-- antenna -->
  <path d="M168 40 L184 14" stroke="#1B3B32" stroke-width="7" stroke-linecap="round"/>
  <circle cx="186" cy="12" r="10" fill="#C8F56A" stroke="#1B3B32" stroke-width="6"/>
  <!-- helmet -->
  <circle cx="128" cy="104" r="84" fill="url(#glass)" stroke="#1B3B32" stroke-width="8"/>
  <!-- cow head -->
  <g>
    <!-- horns -->
    <path d="M86 70c-10-8-12-20-6-28 6 6 14 10 22 12z" fill="#FFF3C9" stroke="#1B3B32" stroke-width="6" stroke-linejoin="round"/>
    <path d="M170 70c10-8 12-20 6-28-6 6-14 10-22 12z" fill="#FFF3C9" stroke="#1B3B32" stroke-width="6" stroke-linejoin="round"/>
    <!-- ears -->
    <ellipse cx="72" cy="96" rx="20" ry="11" transform="rotate(-20 72 96)" fill="#FFFFFF" stroke="#1B3B32" stroke-width="6"/>
    <ellipse cx="184" cy="96" rx="20" ry="11" transform="rotate(20 184 96)" fill="#FFFFFF" stroke="#1B3B32" stroke-width="6"/>
    <ellipse cx="74" cy="96" rx="9" ry="5" transform="rotate(-20 74 96)" fill="#FFB3CC"/>
    <ellipse cx="182" cy="96" rx="9" ry="5" transform="rotate(20 182 96)" fill="#FFB3CC"/>
    <!-- face -->
    <path d="M90 72c0-14 76-14 76 0 6 22 8 46 6 62H84c-2-16 0-40 6-62z" fill="#FFFFFF" stroke="#1B3B32" stroke-width="6" stroke-linejoin="round"/>
    <!-- spots -->
    <path d="M94 74c10-6 24-2 26 8 2 12-12 16-22 12-6-3-8-14-4-20z" fill="#1B3B32"/>
    <path d="M150 112c8-4 18 0 18 8 0 6-8 9-14 7-6-2-8-11-4-15z" fill="#1B3B32"/>
    <!-- eyes -->
    <circle cx="110" cy="104" r="8" fill="#1B3B32"/>
    <circle cx="146" cy="104" r="8" fill="#1B3B32"/>
    <circle cx="113" cy="101" r="3" fill="#fff"/>
    <circle cx="149" cy="101" r="3" fill="#fff"/>
    <!-- snout -->
    <rect x="92" y="122" width="72" height="42" rx="21" fill="#FFB3CC" stroke="#1B3B32" stroke-width="6"/>
    <ellipse cx="114" cy="140" rx="5" ry="7" fill="#1B3B32"/>
    <ellipse cx="142" cy="140" rx="5" ry="7" fill="#1B3B32"/>
    <path d="M118 154q10 6 20 0" stroke="#1B3B32" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- glass shine -->
  <path d="M68 70a70 70 0 0 1 46-42" stroke="#fff" stroke-opacity=".85" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="62" cy="94" r="5" fill="#fff" fill-opacity=".85"/>
  <!-- helmet ring -->
  <path d="M52 150a84 84 0 0 0 152 0" stroke="url(#ring)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M52 150a84 84 0 0 0 152 0" stroke="#1B3B32" stroke-width="4" fill="none" stroke-linecap="round" opacity=".35"/>
</svg>
